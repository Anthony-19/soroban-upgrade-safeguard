name: 'Soroban Upgrade Safeguard'
description: 'Analyze and validate Soroban smart contract upgrades for breaking changes in CI'
author: 'soroban-upgrade-safeguard'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  old-wasm:
    description: 'Path to the old (baseline) WASM file'
    required: false
  new-wasm:
    description: 'Path to the new (upgrade) WASM file'
    required: false
  contract-id:
    description: 'Stellar/Soroban contract ID to fetch the baseline from on-chain'
    required: false
  rpc-url:
    description: 'Stellar RPC URL for fetching the on-chain baseline'
    required: false
  format:
    description: 'Output format: text, json, or markdown'
    required: false
    default: 'text'
  strict:
    description: 'Exit with failure on warnings as well as critical findings'
    required: false
    default: 'false'
  explain:
    description: 'Print remediation guidance for each finding'
    required: false
    default: 'false'
  config:
    description: 'Path to a suppression config file (.safeguard.toml)'
    required: false
  expected-wasm-hash:
    description: 'Expected SHA-256 hash (hex) of the on-chain baseline WASM'
    required: false

outputs:
  verdict:
    description: 'Overall verdict: passed or failed'
    value: ${{ steps.run-safeguard.outputs.verdict }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.run-safeguard.outputs.critical-count }}
  warning-count:
    description: 'Number of warning findings'
    value: ${{ steps.run-safeguard.outputs.warning-count }}
  info-count:
    description: 'Number of info findings'
    value: ${{ steps.run-safeguard.outputs.info-count }}

runs:
  using: 'composite'
  steps:
    - name: Build Docker image
      shell: bash
      run: docker build -t soroban-upgrade-safeguard "${{ github.action_path }}"

    - name: Run Soroban Upgrade Safeguard
      id: run-safeguard
      shell: bash
      run: |
        set -eo pipefail

        ARGS=()

        if [[ -n "${{ inputs.old-wasm }}" ]]; then
          ARGS+=("${{ inputs.old-wasm }}")
        fi
        if [[ -n "${{ inputs.new-wasm }}" ]]; then
          ARGS+=("${{ inputs.new-wasm }}")
        fi
        if [[ -n "${{ inputs.contract-id }}" ]]; then
          ARGS+=(--contract-id "${{ inputs.contract-id }}")
        fi
        if [[ -n "${{ inputs.rpc-url }}" ]]; then
          ARGS+=(--rpc-url "${{ inputs.rpc-url }}")
        fi
        if [[ -n "${{ inputs.format }}" && "${{ inputs.format }}" != "text" ]]; then
          ARGS+=(--format "${{ inputs.format }}")
        fi
        if [[ "${{ inputs.strict }}" == "true" ]]; then
          ARGS+=(--strict)
        fi
        if [[ "${{ inputs.explain }}" == "true" ]]; then
          ARGS+=(--explain)
        fi
        if [[ -n "${{ inputs.config }}" ]]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi
        if [[ -n "${{ inputs.expected-wasm-hash }}" ]]; then
          ARGS+=(--expected-wasm-hash "${{ inputs.expected-wasm-hash }}")
        fi

        # Mount the workspace so the container can access files
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          soroban-upgrade-safeguard \
          "${ARGS[@]}" 2>&1 | tee safeguard-output.txt

        # Capture verdict from exit code
        if [[ ${PIPESTATUS[0]} -eq 0 ]]; then
          echo "verdict=passed" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=failed" >> "$GITHUB_OUTPUT"
        fi

        # Parse counts from output if in JSON format
        if [[ "${{ inputs.format }}" == "json" ]]; then
          CRIT=$(grep -oP '"critical":\s*\K\d+' safeguard-output.txt | head -1)
          WARN=$(grep -oP '"warning":\s*\K\d+' safeguard-output.txt | head -1)
          INFO=$(grep -oP '"info":\s*\K\d+' safeguard-output.txt | head -1)
          echo "critical-count=${CRIT:-0}" >> "$GITHUB_OUTPUT"
          echo "warning-count=${WARN:-0}" >> "$GITHUB_OUTPUT"
          echo "info-count=${INFO:-0}" >> "$GITHUB_OUTPUT"
        else
          echo "critical-count=0" >> "$GITHUB_OUTPUT"
          echo "warning-count=0" >> "$GITHUB_OUTPUT"
          echo "info-count=0" >> "$GITHUB_OUTPUT"
        fi
