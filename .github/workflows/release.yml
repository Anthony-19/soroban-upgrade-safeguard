name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Verify that the pushed tag matches the version in Cargo.toml.  If they
  # disagree the workflow fails loudly rather than publishing a mislabelled
  # artifact.
  # ---------------------------------------------------------------------------
  check-version:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get-version
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: ${CARGO_VERSION}"

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="${{ steps.get-version.outputs.version }}"
          echo "Tag version  : ${TAG}"
          echo "Cargo version : ${CARGO_VERSION}"
          if [ "${TAG}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag v${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version check passed."

  # ---------------------------------------------------------------------------
  # Build a release binary for a single target matrix entry.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            suffix: ""
          - target: x86_64-apple-darwin
            runner: macos-13
            suffix: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          BINARY="soroban-upgrade-safeguard${{ matrix.suffix }}"
          ARCHIVE_DIR="soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/${BINARY}" "${ARCHIVE_DIR}/"
          # Include the README and LICENSE so the archive is self-contained.
          cp README.md LICENSE "${ARCHIVE_DIR}/"
          if [ "${{ matrix.runner }}" = "ubuntu-latest" ]; then
            tar czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}/"
            echo "archive=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            zip -r "${ARCHIVE_DIR}.zip" "${ARCHIVE_DIR}/"
            echo "archive=${ARCHIVE_DIR}.zip" >> "$GITHUB_OUTPUT"
          fi
        id: prepare

      - name: Generate checksum
        shell: bash
        run: |
          cd "${{ runner.temp }}"
          cp "${{ github.workspace }}/${{ steps.prepare.outputs.archive }}" ./
          sha256sum "${{ steps.prepare.outputs.archive }}" > "${{ steps.prepare.outputs.archive }}.sha256"
          echo "checksum=$(cat ${{ steps.prepare.outputs.archive }}.sha256)" >> "$GITHUB_OUTPUT"
        id: checksum

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.archive }}
          path: ${{ steps.prepare.outputs.archive }}

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.archive }}.sha256
          path: ${{ runner.temp }}/${{ steps.prepare.outputs.archive }}.sha256

    outputs:
      archive: ${{ steps.prepare.outputs.archive }}
      checksum: ${{ steps.checksum.outputs.checksum }}

  # ---------------------------------------------------------------------------
  # Create a GitHub Release and attach all built artifacts.
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate combined checksums file
        run: |
          cd artifacts
          # Collect all .sha256 files and merge into a single CHECKSUMS file
          for f in *.sha256; do
            cat "$f" >> CHECKSUMS
            echo "" >> CHECKSUMS
          done
          cat CHECKSUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Soroban Upgrade Safeguard ${{ github.ref_name }}

            ### Prebuilt Binaries

            Download the archive for your platform, verify the checksum, and
            extract the binary:

            ```bash
            # Linux x86_64
            tar xzf soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            sudo mv soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-x86_64-unknown-linux-gnu/soroban-upgrade-safeguard /usr/local/bin/

            # macOS x86_64 (Intel)
            unzip soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-x86_64-apple-darwin.zip
            sudo mv soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-x86_64-apple-darwin/soroban-upgrade-safeguard /usr/local/bin/

            # macOS ARM64 (Apple Silicon)
            unzip soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-aarch64-apple-darwin.zip
            sudo mv soroban-upgrade-safeguard-${{ needs.check-version.outputs.version }}-aarch64-apple-darwin/soroban-upgrade-safeguard /usr/local/bin/
            ```

            ### Verify Checksums

            ```bash
            sha256sum --check CHECKSUMS
            # or on macOS:
            shasum -a 256 --check CHECKSUMS
            ```

            ### Install via Cargo

            ```bash
            cargo install soroban-upgrade-safeguard
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*