# A safe-but-notable change: a field is appended to the end of a storage value
# type. Existing entries still decode for the fields that were already there,
# but they carry no value for the new field, so this is a Warning rather than a
# Critical. Appending to a storage KEY would be a different matter entirely.

[[storage_key]]
name = "DataKey"
kind = "union"
durability = "persistent"

  [[storage_key.variant]]
  name = "Admin"

  [[storage_key.variant]]
  name = "Position"
  type = ["Address"]

[[value_type]]
name = "PositionState"
kind = "struct"
durability = "persistent"

  [[value_type.field]]
  name = "collateral"
  type = "i128"

  [[value_type.field]]
  name = "debt"
  type = "i128"

  [[value_type.field]]
  name = "opened_at"
  type = "u64"
