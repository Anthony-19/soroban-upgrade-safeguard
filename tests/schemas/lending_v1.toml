# Baseline storage layout for the lending-contract scenario.
#
# None of these types appear in the exported contractspecv0 interface of the
# fixture WASM: that is the point. They model the internal storage layout that
# governs on-chain compatibility and was previously invisible to the tool.

[[storage_key]]
name = "DataKey"
kind = "union"
durability = "persistent"

  [[storage_key.variant]]
  name = "Admin"

  [[storage_key.variant]]
  name = "Position"
  type = ["Address"]

[[value_type]]
name = "PositionState"
kind = "struct"
durability = "persistent"

  [[value_type.field]]
  name = "collateral"
  type = "i128"

  [[value_type.field]]
  name = "debt"
  type = "i128"
