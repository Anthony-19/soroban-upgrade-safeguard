# The attack from the issue: PositionState's two fields are swapped.
#
# The exported interface is untouched, so the tool used to report PASSED. Every
# stored position would now decode with collateral and debt reversed.

[[storage_key]]
name = "DataKey"
kind = "union"
durability = "persistent"

  [[storage_key.variant]]
  name = "Admin"

  [[storage_key.variant]]
  name = "Position"
  type = ["Address"]

[[value_type]]
name = "PositionState"
kind = "struct"
durability = "persistent"

  [[value_type.field]]
  name = "debt"
  type = "i128"

  [[value_type.field]]
  name = "collateral"
  type = "i128"
