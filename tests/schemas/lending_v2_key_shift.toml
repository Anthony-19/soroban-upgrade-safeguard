# The second half of the attack: a storage-key variant is renamed, so its
# discriminant no longer addresses the entries written under the old name.
# Existing keys stop resolving and every position is orphaned.

[[storage_key]]
name = "DataKey"
kind = "union"
durability = "persistent"

  [[storage_key.variant]]
  name = "Admin"

  [[storage_key.variant]]
  name = "Positions"
  type = ["Address"]

[[value_type]]
name = "PositionState"
kind = "struct"
durability = "persistent"

  [[value_type.field]]
  name = "collateral"
  type = "i128"

  [[value_type.field]]
  name = "debt"
  type = "i128"
