# Fixture v4 — clean baseline for unions, error enums, nested containers,
# and cascading-dependency detection.
#
# This is the "before" contract for the v4→v5 breaking-change pair and the
# v4→v4 identity (zero false-positive) pair.
[package]
name = "mock-contract-v4"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
