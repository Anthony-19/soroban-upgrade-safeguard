# Example storage-schema manifest for Soroban Upgrade Safeguard.
#
# WHY THIS FILE EXISTS
# --------------------
# The tool reads a contract's exported `contractspecv0` interface. That section
# describes the callable surface — it does NOT describe what the contract writes
# to storage. Storage compatibility is decided by two things that need not be
# exported at all:
#
#   1. storage-key types, whose discriminants address entries, and
#   2. the layout of internal value types serialized into storage.
#
# An upgrade can keep its public interface byte-identical while reordering the
# fields of an internal struct or shifting a storage-key discriminant. That is
# guaranteed on-chain data corruption, and without this manifest the tool cannot
# see it. Declaring those types here brings them into scope so they are diffed
# with the same engine and severities as exported types.
#
# HOW TO USE IT
# -------------
# A manifest describes the storage layout of ONE build. Detecting a reorder
# requires two snapshots, so you supply one manifest per side:
#
#   soroban-upgrade-safeguard old.wasm new.wasm \
#     --old-storage-schema ./schemas/v1.storage-schema.toml \
#     --new-storage-schema ./schemas/v2.storage-schema.toml
#
# Keep the manifest versioned next to your contract and update it in the same
# commit that changes a storage type. JSON is accepted with the same shape.
#
# DECLARATION ORDER IS LAYOUT
# ---------------------------
# Field order in a struct and variant order in a union are significant: Soroban
# serializes them positionally. Write them in the order your Rust type declares
# them. For a unit enum, `value` is the discriminant actually stored.

# --------------------------------------------------------------------------
# Storage-key types: what addresses your entries.
# --------------------------------------------------------------------------
[[storage_key]]
name = "DataKey"
kind = "union"             # "union" for data-carrying, "enum" for unit variants
durability = "persistent"  # persistent | instance | temporary

  [[storage_key.variant]]
  name = "Admin"           # void variant — no payload

  [[storage_key.variant]]
  name = "Position"
  type = ["Address"]       # tuple payload types, in order

  [[storage_key.variant]]
  name = "Allowance"
  type = ["Address", "Address"]

# --------------------------------------------------------------------------
# Internal value types: what you serialize into those entries.
# --------------------------------------------------------------------------
[[value_type]]
name = "PositionState"
kind = "struct"
durability = "persistent"
doc = "Per-account lending position. Never exported; storage payload only."

  [[value_type.field]]
  name = "collateral"
  type = "i128"

  [[value_type.field]]
  name = "debt"
  type = "i128"

[[value_type]]
name = "Status"
kind = "enum"
durability = "instance"

  [[value_type.case]]
  name = "Active"
  value = 0

  [[value_type.case]]
  name = "Paused"
  value = 1

# --------------------------------------------------------------------------
# Type spelling reference (same as the report prints, so findings paste back in)
# --------------------------------------------------------------------------
#   scalars     bool u32 i32 u64 i64 u128 i128 u256 i256
#   built-ins   Bytes String Symbol Address Timepoint Duration Val Error ()
#   containers  Option<T>  Vec<T>  Map<K, V>  Result<T, E>  BytesN<32>
#   tuple       (Address, u32)
#   user types  PositionState        (exported or declared in this manifest)
