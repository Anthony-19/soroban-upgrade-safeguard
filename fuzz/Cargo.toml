[package]
name = "soroban-upgrade-safeguard-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.soroban-upgrade-safeguard]
path = ".."

# stellar-xdr's `arbitrary` feature is scoped to this fuzz crate (dev/fuzz only),
# NOT the shipped binary — see issue #79, which proposes dropping `arbitrary`
# from the normal build. Keeping it here is the justification for retaining the
# feature: it stays available for structure-aware fuzz targets. The current
# targets feed raw bytes (the strongest robustness test for the decode loop),
# so the feature is declared and available but not yet imported.
[dependencies.stellar-xdr]
version = "21.2.0"
features = ["std", "curr", "arbitrary", "base64"]

# Detach from the parent package so `cargo build`/`cargo test`/`cargo clippy` at
# the repo root never try to compile the fuzz crate (it needs a nightly
# toolchain and libFuzzer, which are not part of the normal test run).
[workspace]

[[bin]]
name = "extract_metadata"
path = "fuzz_targets/extract_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_spec_entries"
path = "fuzz_targets/decode_spec_entries.rs"
test = false
doc = false
bench = false
