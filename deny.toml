# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Vulnerability advisories
# ---------------------------------------------------------------------------
# Policy: advisories block the build (deny on error).
# Rationale: this tool parses untrusted WASM (wasmparser), decodes untrusted
# XDR (stellar-xdr), and makes outbound HTTPS requests (ureq + TLS stack).
# A published advisory against any of those is directly exploitable. Blocking
# on any unfixed advisory is therefore the safer default.
#
# If an advisory must be accepted temporarily (e.g. no fix exists yet and the
# affected code path is not reachable), add it to the `ignore` list below with
# a comment documenting the decision and a tracking issue.
[advisories]
version = 2
# Advisories that are deliberately accepted. Keep this list empty unless a
# specific, documented exception is required.
ignore = []

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
# Policy: deny any license not in the allow list.
# The crate is MIT-licensed. The allow list covers permissive licenses that
# are compatible with MIT in both open-source and commercial use.
[licenses]
version = 2
# Licenses that are explicitly allowed in the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
]
# Treat any dependency whose license cannot be determined as an error.
unlicensed = "deny"
# Treat copyleft licenses (GPL, LGPL, AGPL, MPL, etc.) as errors unless
# explicitly listed above.
copyleft = "deny"
# Some crates use non-standard SPDX expressions or dual-licensing. Allow
# the clarification file below to override per-crate when needed.
exceptions = []

# ---------------------------------------------------------------------------
# Dependency sources
# ---------------------------------------------------------------------------
# Only allow dependencies from crates.io and git sources explicitly listed
# here. This prevents accidental use of local path overrides or unknown
# registries in CI.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ---------------------------------------------------------------------------
# Bans (duplicate crates, wildcard deps, etc.)
# ---------------------------------------------------------------------------
[bans]
# Warn (rather than deny) on multiple versions of the same crate.
# Soroban's dependency tree is large and sometimes pulls in duplicate semver
# ranges; hard-denying would create unnecessary churn. Switch to "deny" once
# the tree stabilises.
multiple-versions = "warn"
# Deny wildcard (path = "*") dependencies entirely.
wildcards = "deny"
